services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.production
    container_name: currency-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:19301:3001"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
